name: tse-historico

on:
  workflow_dispatch:
  push:
    branches: [tse-2026-votos]
    paths:
      - 'tse2026/historico_2t.py'
      - '.github/workflows/tse_historico.yml'

permissions:
  contents: write

concurrency:
  group: tse-historico
  cancel-in-progress: false

jobs:
  historico:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Baixar série histórica do TSE e consolidar
        run: python3 tse2026/historico_2t.py

      - name: Publicar resultados no branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tse2026/saida/historico tse2026/raw/historico_status.json || true
          git commit -m "tse2026: série histórica de 2º turnos (run ${{ github.run_id }}) [skip ci]" || echo "nada a commitar"
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push origin "HEAD:${{ github.ref_name }}"
