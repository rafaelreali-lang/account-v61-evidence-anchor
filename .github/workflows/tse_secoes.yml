name: tse-secoes

on:
  workflow_dispatch:
  push:
    branches: [tse-2026-votos]
    paths:
      - 'tse2026/secoes_2t.py'
      - '.github/workflows/tse_secoes.yml'

permissions:
  contents: write

concurrency:
  group: tse-secoes
  cancel-in-progress: false

jobs:
  secoes:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Municípios, zonas e boletins de urna do 2º turno
        run: python3 tse2026/secoes_2t.py

      - name: Publicar resultados no branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tse2026/saida/secoes_2t tse2026/raw/secoes_status.json || true
          git commit -m "tse2026: seções, zonas e municípios do 2º turno (run ${{ github.run_id }}) [skip ci]" || echo "nada a commitar"
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push origin "HEAD:${{ github.ref_name }}"
