name: tse2026

on:
  workflow_dispatch:
  push:
    branches: [tse-2026-votos]
    paths:
      - 'tse2026/*.py'
      - '.github/workflows/tse2026.yml'

permissions:
  contents: write

concurrency:
  group: tse2026
  cancel-in-progress: false

jobs:
  extrair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Baixar e agregar (fonte TSE)
        run: python3 tse2026/fetch_tse.py

      - name: Publicar resultados no branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tse2026/saida tse2026/raw || true
          git commit -m "tse2026: resultados extraidos do TSE (run ${{ github.run_id }}) [skip ci]" || echo "nada a commitar"
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Artefato com brutos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tse2026-run-${{ github.run_id }}
          path: tse2026/
          retention-days: 7
